name: Deploy to AWS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./packages/backend
        run: |
          npm install
      - name: Install Frontend Dependencies
        working-directory: ./packages/frontend
        run: npm ci

      - name: Install Dependencies (Root)
        run: npm install

      - name: Build Backend
        working-directory: ./packages/backend
        run: npm run build

      - name: Build Frontend (Verification)
        working-directory: ./packages/frontend
        run: npm run build

      # - name: Install AWS CDK (Removed to use local npx cdk)
      #   run: npm install -g aws-cdk

      - name: Debug Root Dependencies
        run: |
          ls -la node_modules/.bin/
          ls -F node_modules/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Deploy Dev Environment (On Pull Request OR Push to Develop)
      - name: Deploy DEV Stack
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        working-directory: ./packages/backend
        run: |
          ../../node_modules/.bin/cdk bootstrap --require-approval never -c stage=dev
          ../../node_modules/.bin/cdk deploy --all --require-approval never -c stage=dev --outputs-file ./cdk-outputs.json
          
          # Extract Outputs
          echo "Extracting Outputs..."
          API_URL=$(jq -r '."Dev-TravelDiscoveryApiStack".TravelDiscoveryApiEndpoint*' ./cdk-outputs.json)
          BUCKET_NAME=$(jq -r '."Dev-TravelDiscoveryFrontendStack".FrontendBucketName' ./cdk-outputs.json)
          DISTRIBUTION_ID=$(jq -r '."Dev-TravelDiscoveryFrontendStack".FrontendDistributionId' ./cdk-outputs.json)
          
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          echo "DISTRIBUTION_ID=$DISTRIBUTION_ID" >> $GITHUB_ENV
          
          echo "API URL: $API_URL"
          echo "Bucket: $BUCKET_NAME"

      - name: Build and Deploy Frontend (DEV)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        working-directory: ./packages/frontend
        run: |
          # Build with the dynamic API URL
          export VITE_API_URL=${{ env.API_URL }}
          npm run build
          
          # Sync to S3
          aws s3 sync dist/ s3://${{ env.BUCKET_NAME }} --delete
          
          # Invalidate CloudFront
          aws cloudfront create-invalidation --distribution-id ${{ env.DISTRIBUTION_ID }} --paths "/*"

      # Deploy Prod Environment (On Merge to Main)
      - name: Deploy PROD Stack
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./packages/backend
        run: ../../node_modules/.bin/cdk deploy --all --require-approval never -c stage=prod
